<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — ProcureDesk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    body { background: linear-gradient(135deg, #1B3F6E 0%, #122c4f 100%); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .login-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
                  width: 100%; max-width: 400px; overflow: hidden; }
    .login-header { background: var(--brand); padding: 32px; text-align: center; }
    .login-logo { color: #fff; font-size: 22px; font-weight: 700; display: flex;
                  align-items: center; justify-content: center; gap: 10px; }
    .login-logo-icon { background: rgba(255,255,255,.15); border-radius: 10px; padding: 8px 10px; }
    .login-sub { color: rgba(255,255,255,.6); font-size: 13px; margin-top: 6px; }
    .login-body { padding: 32px; }
    .login-body h2 { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
    .login-body p  { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
    .form-group { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <span class="login-logo-icon"><i class="bi bi-file-earmark-check" style="font-size:20px"></i></span>
        ProcureDesk
      </div>
      <div class="login-sub">Purchase Order Management System</div>
    </div>
    <div class="login-body">
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue</p>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Username</label>
          {{ form.username }}
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          {{ form.password }}
        </div>
        {% if form.errors %}
          <div class="alert alert-danger" style="margin-bottom:16px">
            <i class="bi bi-exclamation-circle"></i>
            <span>Invalid username or password.</span>
          </div>
        {% endif %}
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="bi bi-arrow-right-circle"></i> Sign In
        </button>
      </form>
    </div>
  </div>
</body>
</html>
