<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>OSH Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
{% load static %}<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head><body style="background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh">
<div style="width:100%;max-width:400px;padding:24px">
  <div style="text-align:center;margin-bottom:28px">
    <div style="background:var(--brand);width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
      <i class="bi bi-shield-check" style="color:#fff;font-size:24px"></i>
    </div>
    <h1 style="font-size:20px;font-weight:700;color:var(--brand)">OSH Compliance System</h1>
    <p style="color:var(--muted);font-size:13px;margin-top:4px">Sign in to continue</p>
  </div>
  <div class="card">
    <div class="card-body">
      {% if form.errors %}
      <div class="alert alert-danger"><i class="bi bi-exclamation-circle"></i><span>Invalid username or password.</span></div>
      {% endif %}
      <form method="post">{% csrf_token %}
        <div class="form-group"><label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" autofocus></div>
        <div class="form-group"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
      </form>
    </div>
  </div>
</div></body></html>
